[package]
name = "lowp"
description = "Lightweight software floats for low-precision formats"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
license = "MIT"
documentation = "https://docs.rs/lowp"
repository = "https://github.com/bobbothe2nd/lowp"

[features]
# use standard library
alloc = []
std = ["num-traits?/std"]

# no-std impl for num_traits::Float
libm = ["num-traits?/libm"]

# ecosystem support
stable_auto = ["dep:stable_auto"]
serde = ["dep:serde"]
half = ["dep:half"]
bytemuck = ["dep:bytemuck"]
zerocopy = ["dep:zerocopy"]
num-traits = ["dep:num-traits"]

# what LUTs to use
lut-f4 = []

[dependencies]
half = { version = "2.4.1", default-features = false, optional = true }
bytemuck = { version = "1.4.1", default-features = false, features = ["derive"], optional = true }
zerocopy = { version = "0.6.0", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
num-traits = { version = "0.2.14", default-features = false, optional = true }
stable_auto = { version = "0.4.0", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5"
float4 = "0.2.0"
float8 = "0.7"

[[bench]]
name = "float4_diff"
harness = false

[[bench]]
name = "float8_diff"
harness = false
